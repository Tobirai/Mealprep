<style>
:root{color-scheme:light dark;--bg:#ffffff;--ink:#15201a;--mut:#55635a;--line:#c9d5cc;--field:#ffffff;--band:#163d29;--green:#2b7747;--red:#c22f1a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1411;--ink:#e6efe8;--mut:#a3b3a8;--line:#3a4d41;--field:#151d18;--green:#3a9159;--red:#ff8a70}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#lock[hidden]{display:none}
.band{background:var(--band);color:#fff;padding:calc(env(safe-area-inset-top) + 30px) 24px 28px}
.band .in{max-width:420px;margin:0 auto;display:flex;align-items:center;gap:14px}
.band img{width:54px;height:54px;border-radius:13px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.band h1{margin:0;font-size:25px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.band p{margin:3px 0 0;font-size:14.5px;opacity:.82}
form{max-width:420px;margin:0 auto;padding:30px 24px calc(env(safe-area-inset-bottom) + 30px)}
label[for=pw]{display:block;font-weight:600;margin-bottom:7px}
#pw{display:block;width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);-webkit-appearance:none;appearance:none}
#pw:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(58,145,89,.28)}
.chk{display:flex;gap:10px;align-items:center;margin:16px 0 22px;color:var(--mut);font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--green)}
#go{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border:0;border-radius:10px;background:var(--green);color:#fff;cursor:pointer}
#go:disabled{opacity:.6;cursor:default}
#msg{min-height:1.5em;margin:14px 0 0;color:var(--red);font-weight:600}
#msg.info{color:var(--mut);font-weight:400}
.hint{margin:18px 0 0;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div id="lock" hidden>
<header class="band"><div class="in"><img src="icon-180.png" alt=""><div><h1>Meal-Prep</h1><p>Geschützte Rezeptsammlung</p></div></div></header>
<form id="f">
<label for="pw">Passwort</label>
<input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
<label class="chk"><input id="rem" type="checkbox" checked> Auf diesem Gerät merken</label>
<button id="go" type="submit">Öffnen</button>
<p id="msg" role="status" aria-live="polite"></p>
<p class="hint">Einmal entsperrt, öffnet sich die App direkt und funktioniert auch ohne Internet.</p>
</form>
</div>

<script>
(function () {
  'use strict';
  var STORE = 'mealprep-schluessel';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var P = JSON.parse(document.getElementById('payload').textContent);
  var lock = document.getElementById('lock'), form = document.getElementById('f'), pw = document.getElementById('pw'),
      rem = document.getElementById('rem'), msg = document.getElementById('msg'), go = document.getElementById('go');
  var subtle = window.crypto && window.crypto.subtle;

  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function text64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function load() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function save(v) { try { if (v) localStorage.setItem(STORE, v); else localStorage.removeItem(STORE); } catch (e) {} }
  function say(t, info) { msg.textContent = t; msg.className = info ? 'info' : ''; }
  function showLock() { lock.hidden = false; try { pw.focus(); } catch (e) {} }
  // Die Seite erst austauschen, wenn sie fertig geladen ist; sonst hängt der Browser den Inhalt nur an.
  var loaded = document.readyState === 'complete', pending = null;
  window.addEventListener('load', function () { loaded = true; flush(); });
  function flush() { if (loaded && pending !== null) { var h = pending; pending = null; document.open(); document.write(h); document.close(); } }
  function reveal(html) { pending = html; flush(); }
  function decrypt(key) {
    return subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.c))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function derive(pass) {
    var n = pass.trim().toLowerCase();
    if (n.normalize) n = n.normalize('NFC');
    return subtle.importKey('raw', new TextEncoder().encode(n), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.it, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }

  if (!subtle) { showLock(); go.disabled = true; say('Bitte die Seite über ihre https-Adresse öffnen, nur dann lässt sie sich entschlüsseln.'); return; }

  var saved = load();
  Promise.resolve().then(function () {
    if (!saved) throw 0;
    return subtle.importKey('raw', bytes(saved), { name: 'AES-GCM' }, false, ['decrypt']).then(decrypt);
  }).then(reveal, function () { if (saved) save(null); showLock(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value.trim()) { pw.focus(); return; }
    go.disabled = true; say('Wird entsperrt …', true);
    derive(pw.value).then(function (key) {
      return decrypt(key).then(function (html) {
        if (!rem.checked) { save(null); return html; }
        return subtle.exportKey('raw', key).then(function (raw) { save(text64(raw)); return html; });
      });
    }).then(reveal, function () {
      go.disabled = false; say('Das Passwort stimmt nicht.'); pw.focus(); pw.select();
    });
  });
})();
</script>
